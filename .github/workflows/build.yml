name: Build Cheat Engine

on:
  push:
    branches:
      - master
      - main
      - 'copilot/**'
      - 'feature/**'
      - 'fix/**'
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create a GitHub Release after building'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

# ─────────────────────────────────────────────────────────────────────────────
# Concurrency: cancel any in-progress runs on the same ref
# ─────────────────────────────────────────────────────────────────────────────
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
# ═════════════════════════════════════════════════════════════════════════════
# JOB 1 – Main build job (Lazarus + VS C++ + .NET + TCC + DBK)
#   Uses windows-latest to avoid runner queue issues
# ═════════════════════════════════════════════════════════════════════════════
  build:
    name: "Build All Components"
    runs-on: windows-latest

    steps:
      # ── Checkout ────────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Lazarus toolchain ───────────────────────────────────────────────────
      - name: Install Lazarus 2.2.2
        uses: gcarreno/setup-lazarus@v3
        with:
          lazarus-version: "2.2.2"
          with-cache: false

      - name: Install FPC cross-compiler (i386-win32)
        shell: pwsh
        continue-on-error: true
        run: |
          Write-Host "Downloading i386-win32 cross-compiler via curl..."
          # curl.exe follows SourceForge redirects correctly
          curl.exe -L --retry 5 --retry-delay 10 -o cross-i386.exe `
            "https://sourceforge.net/projects/lazarus/files/Lazarus%20Windows%2064%20bits/Lazarus%202.2.2/lazarus-2.2.2-fpc-3.2.2-cross-i386-win32-win64.exe/download"
          if ($LASTEXITCODE -ne 0) { Write-Warning "curl download failed (exit $LASTEXITCODE)"; exit 0 }
          $size = (Get-Item cross-i386.exe).Length
          Write-Host "Downloaded $size bytes"
          if ($size -lt 1MB) {
            Write-Warning "File too small ($size bytes) – likely an HTML redirect page, skipping install"
            exit 0
          }
          Write-Host "Installing cross-compiler..."
          Start-Process -Wait -FilePath ".\cross-i386.exe" `
            -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-'
          Write-Host "Cross-compiler installed."

      # ── Visual Studio toolchain ─────────────────────────────────────────────
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      # ── MinGW (for tcclib) ──────────────────────────────────────────────────
      - name: Install MinGW (for TCC build)
        shell: cmd
        run: choco install mingw -y --no-progress

      # ═══════════════════════════════════════════════════════════════════════
      # LAZARUS PROJECTS
      # ═══════════════════════════════════════════════════════════════════════

      # ── speedhack ──────────────────────────────────────────────────────────
      - name: Build speedhack (32-bit)
        working-directory: "Cheat Engine/speedhack"
        shell: cmd
        continue-on-error: true
        run: lazbuild speedhack.lpi --build-mode="32-bit" --build-all

      - name: Build speedhack (64-bit)
        working-directory: "Cheat Engine/speedhack"
        shell: cmd
        continue-on-error: true
        run: lazbuild speedhack.lpi --build-mode="64-bit" --build-all

      # ── luaclient ──────────────────────────────────────────────────────────
      - name: Build luaclient (32-bit)
        working-directory: "Cheat Engine/luaclient"
        shell: cmd
        continue-on-error: true
        run: lazbuild luaclient.lpi --build-mode="Release 32" --build-all

      - name: Build luaclient (64-bit)
        working-directory: "Cheat Engine/luaclient"
        shell: cmd
        continue-on-error: true
        run: lazbuild luaclient.lpi --build-mode="Release 64" --build-all

      # ── VEHDebug ───────────────────────────────────────────────────────────
      - name: Build VEHDebug (32-bit)
        working-directory: "Cheat Engine/VEHDebug"
        shell: cmd
        continue-on-error: true
        run: lazbuild vehdebug.lpi --build-mode="release 32" --build-all

      - name: Build VEHDebug (64-bit)
        working-directory: "Cheat Engine/VEHDebug"
        shell: cmd
        continue-on-error: true
        run: lazbuild vehdebug.lpi --build-mode="release 64" --build-all

      # ── Cheat Engine (main EXE) ────────────────────────────────────────────
      - name: Build Cheat Engine (32-bit)
        working-directory: "Cheat Engine"
        shell: cmd
        continue-on-error: true
        run: lazbuild cheatengine.lpi --build-mode="Release 32-Bit" --build-all

      - name: Build Cheat Engine (64-bit)
        working-directory: "Cheat Engine"
        shell: cmd
        continue-on-error: true
        run: lazbuild cheatengine.lpi --build-mode="Release 64-Bit" --build-all

      # ═══════════════════════════════════════════════════════════════════════
      # VISUAL STUDIO C++ PROJECTS
      # ═══════════════════════════════════════════════════════════════════════

      # ── DirectX Mess ───────────────────────────────────────────────────────
      - name: Build DirectXMess (Win32 + x64)
        working-directory: "Cheat Engine/Direct x mess"
        shell: cmd
        continue-on-error: true
        run: |
          msbuild "Direct x mess.sln" /p:Configuration=Release /p:Platform=Win32 /p:PlatformToolset=v143 /p:WindowsTargetPlatformVersion=10.0 /m /t:Rebuild
          msbuild "Direct x mess.sln" /p:Configuration=Release /p:Platform=x64   /p:PlatformToolset=v143 /p:WindowsTargetPlatformVersion=10.0 /m /t:Rebuild

      # ── MonoDataCollector ──────────────────────────────────────────────────
      - name: Build MonoDataCollector (Win32 + x64)
        working-directory: "Cheat Engine/MonoDataCollector"
        shell: cmd
        continue-on-error: true
        run: |
          msbuild MonoDataCollector.sln /p:Configuration=Release /p:Platform=Win32 /p:PlatformToolset=v143 /p:WindowsTargetPlatformVersion=10.0 /m /t:Rebuild
          msbuild MonoDataCollector.sln /p:Configuration=Release /p:Platform=x64   /p:PlatformToolset=v143 /p:WindowsTargetPlatformVersion=10.0 /m /t:Rebuild

      # ── DotNetDataCollector ────────────────────────────────────────────────
      - name: Build DotNetDataCollector (Win32 + x64)
        working-directory: "Cheat Engine/DotNetDataCollector"
        shell: cmd
        continue-on-error: true
        run: |
          msbuild DotNetDataCollector.sln /p:Configuration=Release /p:Platform=Win32 /p:PlatformToolset=v143 /p:WindowsTargetPlatformVersion=10.0 /m /t:Rebuild
          msbuild DotNetDataCollector.sln /p:Configuration=Release /p:Platform=x64   /p:PlatformToolset=v143 /p:WindowsTargetPlatformVersion=10.0 /m /t:Rebuild

      # ── CEJVMTI ────────────────────────────────────────────────────────────
      - name: Detect JAVA_HOME for CEJVMTI
        id: java
        shell: pwsh
        continue-on-error: true
        run: |
          $jdk = @(
            $env:JAVA_HOME_11_X64,
            $env:JAVA_HOME_17_X64,
            $env:JAVA_HOME_8_X64,
            $env:JAVA_HOME
          ) | Where-Object { $_ -and (Test-Path "$_\include\jvmti.h") } | Select-Object -First 1
          if ($jdk) {
            Write-Host "JDK with jvmti.h: $jdk"
            "CEJVMTI_JDK=$jdk" | Out-File -FilePath $env:GITHUB_ENV -Append
          } else {
            Write-Warning "Could not find JDK with jvmti.h"
          }

      - name: Build CEJVMTI (Win32 + x64)
        working-directory: "Cheat Engine/Java/CEJVMTI"
        shell: cmd
        continue-on-error: true
        run: |
          msbuild CEJVMTI.sln /p:Configuration=Release /p:Platform=Win32 /p:PlatformToolset=v143 /p:WindowsTargetPlatformVersion=10.0 "/p:AdditionalIncludeDirectories=%CEJVMTI_JDK%\include;%CEJVMTI_JDK%\include\win32" /m /t:Rebuild
          msbuild CEJVMTI.sln /p:Configuration=Release /p:Platform=x64   /p:PlatformToolset=v143 /p:WindowsTargetPlatformVersion=10.0 "/p:AdditionalIncludeDirectories=%CEJVMTI_JDK%\include;%CEJVMTI_JDK%\include\win32" /m /t:Rebuild

      # ═══════════════════════════════════════════════════════════════════════
      # .NET / C# PROJECTS
      # ═══════════════════════════════════════════════════════════════════════

      - name: Build CSCompiler (.NET)
        working-directory: "Cheat Engine/DotNetCompiler/CSCompiler"
        shell: cmd
        continue-on-error: true
        run: msbuild CSCompiler.sln /p:Configuration=Release /p:Platform="Any CPU" /nologo /m /t:Rebuild

      - name: Build DotNetInvasiveDataCollector (.NET)
        working-directory: "Cheat Engine/DotNetInvasiveDataCollector"
        shell: cmd
        continue-on-error: true
        run: msbuild DotNetInvasiveDataCollector.sln /p:Configuration=Release /p:Platform="Any CPU" /p:SignAssembly=false /nologo /m /t:Rebuild

      # ═══════════════════════════════════════════════════════════════════════
      # TCC LIBRARY (MinGW build)
      # ═══════════════════════════════════════════════════════════════════════

      - name: Build TCC Library (32-bit + 64-bit)
        working-directory: "Cheat Engine/tcclib/win32"
        shell: cmd
        continue-on-error: true
        run: |
          build-tcc.bat -t 32 -x
          build-tcc.bat -t 64 -x

      # ═══════════════════════════════════════════════════════════════════════
      # DBK KERNEL DRIVER (best-effort, requires WDK)
      # ═══════════════════════════════════════════════════════════════════════

      - name: Install Windows Driver Kit (WDK)
        shell: cmd
        continue-on-error: true
        run: choco install windows-driver-kit-10 -y --no-progress

      - name: Build DBKKernel (x64 + Win32 – no-sig)
        working-directory: DBKKernel
        shell: cmd
        continue-on-error: true
        run: |
          msbuild DBKKernel.sln "/p:Configuration=Release without sig" /p:Platform=x64   /p:WindowsTargetPlatformVersion=10.0 /nologo /m /t:Rebuild
          msbuild DBKKernel.sln "/p:Configuration=Release without sig" /p:Platform=Win32 /p:WindowsTargetPlatformVersion=10.0 /nologo /m /t:Rebuild

      # ═══════════════════════════════════════════════════════════════════════
      # COLLECT & UPLOAD ARTIFACTS
      # ═══════════════════════════════════════════════════════════════════════

      - name: Show build outputs
        shell: pwsh
        run: |
          Write-Host "=== Cheat Engine bin/ ==="
          if (Test-Path "Cheat Engine\bin") {
            Get-ChildItem -Path "Cheat Engine\bin" -Recurse -Include "*.exe","*.dll","*.sys","*.inf" |
              Sort-Object FullName | Format-Table Name, Length, Directory -AutoSize
          }
          Write-Host "=== DirectX Mess output ==="
          Get-ChildItem -Path "Cheat Engine\Direct x mess" -Recurse -Include "*.dll" `
            -ErrorAction SilentlyContinue | Sort-Object FullName | Format-Table Name, Length -AutoSize
          Write-Host "=== DBKKernel output ==="
          Get-ChildItem -Path "DBKKernel" -Recurse -Include "*.sys","*.inf" `
            -ErrorAction SilentlyContinue | Sort-Object FullName | Format-Table Name, Length -AutoSize
          Write-Host "=== TCC output ==="
          Get-ChildItem -Path "Cheat Engine\tcclib\win32" -Include "*.exe","*.dll" `
            -ErrorAction SilentlyContinue | Sort-Object FullName | Format-Table Name, Length -AutoSize

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CheatEngine-Build-${{ github.run_number }}
          path: |
            Cheat Engine/bin/**
            Cheat Engine/Direct x mess/Release/**
            Cheat Engine/Direct x mess/x64/Release/**
            Cheat Engine/tcclib/win32/*.exe
            Cheat Engine/tcclib/win32/*.dll
            Cheat Engine/tcclib/win32/lib/*.a
            DBKKernel/**/*.sys
            DBKKernel/**/*.inf
          if-no-files-found: warn

# ═════════════════════════════════════════════════════════════════════════════
# JOB 2 – GitHub Release (only on tags or manual trigger)
# ═════════════════════════════════════════════════════════════════════════════
  release:
    name: "Create GitHub Release"
    needs: build
    if: >-
      always() && needs.build.result != 'cancelled' &&
      (
        startsWith(github.ref, 'refs/tags/v') ||
        (github.event_name == 'workflow_dispatch' && inputs.create_release == true)
      )
    runs-on: ubuntu-latest

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: CheatEngine-Build-${{ github.run_number }}
          path: release-files/

      - name: List release files
        run: find release-files/ -type f | sort

      - name: Determine version tag
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=build-$(echo $GITHUB_SHA | cut -c1-8)" >> "$GITHUB_OUTPUT"
          fi

      - name: Package release ZIP
        run: |
          cd release-files
          zip -r "../CheatEngine-${{ steps.ver.outputs.tag }}.zip" .
          ls -lh "../CheatEngine-${{ steps.ver.outputs.tag }}.zip"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: "Cheat Engine ${{ steps.ver.outputs.tag }}"
          draft: false
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          generate_release_notes: true
          files: |
            CheatEngine-${{ steps.ver.outputs.tag }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
