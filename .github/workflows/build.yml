name: Build Cheat Engine
on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Lazarus
        uses: gcarreno/setup-lazarus@v3
        with:
          lazarus-version: "2.2.2"
          with-cache: false

      - name: Install 32-bit cross compiler
        shell: pwsh
        run: |
          $url = "https://sourceforge.net/projects/lazarus/files/Lazarus%20Windows%2064%20bits/Lazarus%202.2.2/lazarus-2.2.2-fpc-3.2.2-cross-i386-win32-win64.exe/download"
          curl.exe -L -o cross-compiler.exe $url
          Start-Process -Wait -FilePath .\cross-compiler.exe -ArgumentList "/verysilent"

      - name: Build 64-Bit
        shell: cmd
        run: lazbuild --build-mode="Release 64-bit" --no-write-project "Cheat Engine/cheatengine.lpi"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CheatEngine-x64
          path: Cheat Engine/bin/
          if-no-files-found: error
