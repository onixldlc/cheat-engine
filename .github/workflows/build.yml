name: Build Cheat Engine

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

env:
  LAZARUS_VERSION: "3.6"
  FPC_VERSION: "3.2.4"

jobs:
  # =========================================================================
  # Job 1: Build all Lazarus / FreePascal components on Windows
  # =========================================================================
  build-lazarus:
    name: Build Lazarus Components (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------------------------
      # Install Lazarus (win64 base) via the official setup-lazarus action,
      # then add the i386-win32 cross-compiler with curl.exe so that both
      # 32-bit and 64-bit targets can be built on this 64-bit runner.
      # ------------------------------------------------------------------
      - name: Setup Lazarus ${{ env.LAZARUS_VERSION }}
        uses: gcarreno/setup-lazarus@v3.4.1
        with:
          lazarus-version: ${{ env.LAZARUS_VERSION }}
          with-cache: false

      - name: Download i386-win32 cross-compiler
        shell: pwsh
        run: |
          $ver = $env:LAZARUS_VERSION
          $fpc = $env:FPC_VERSION
          # Use downloads.sourceforge.net direct-download URL (bypasses JavaScript waiting page)
          $url = "https://downloads.sourceforge.net/project/lazarus/Lazarus%20Windows%2064%20bits/Lazarus%20$ver/lazarus-$ver-fpc-$fpc-cross-i386-win32-win64.exe"
          Write-Host "Downloading cross-compiler: $url"
          curl.exe -L --retry 3 --retry-delay 5 -o lazarus-cross-i386.exe $url
          if ($LASTEXITCODE -ne 0) { Write-Error "Cross-compiler download failed"; exit 1 }
          $size = (Get-Item lazarus-cross-i386.exe).Length
          Write-Host "Downloaded $size bytes"
          if ($size -lt 100000) { Write-Error "File too small ($size bytes) - likely an HTML error page"; exit 1 }

      - name: Install i386-win32 cross-compiler
        shell: pwsh
        run: Start-Process -FilePath ".\lazarus-cross-i386.exe" -ArgumentList "/verysilent /norestart" -Wait

      - name: Verify lazbuild
        shell: pwsh
        run: |
          $laz = (Get-Command lazbuild -ErrorAction SilentlyContinue)?.Source
          if (-not $laz) { $laz = "C:\lazarus\lazbuild.exe" }
          Write-Host "lazbuild: $laz"
          & $laz --version

      # ------------------------------------------------------------------
      # Build main Cheat Engine (32-bit and 64-bit)
      # ------------------------------------------------------------------
      - name: Build Cheat Engine 32-bit
        run: lazbuild "Cheat Engine\cheatengine.lpi" --build-mode="Release 32-Bit" --build-all

      - name: Build Cheat Engine 64-bit
        run: lazbuild "Cheat Engine\cheatengine.lpi" --build-mode="Release 64-Bit" --build-all

      # ------------------------------------------------------------------
      # Build Launcher
      # ------------------------------------------------------------------
      - name: Build Launcher
        run: lazbuild "Cheat Engine\launcher\cheatengine.lpi" --build-mode=release --build-all

      # ------------------------------------------------------------------
      # Build winhook DLL (32-bit and 64-bit)
      # ------------------------------------------------------------------
      - name: Build winhook 32-bit
        run: lazbuild "Cheat Engine\winhook\winhook.lpi" --build-mode="Release 32" --build-all

      - name: Build winhook 64-bit
        run: lazbuild "Cheat Engine\winhook\winhook.lpi" --build-mode="Release 64" --build-all

      # ------------------------------------------------------------------
      # Build speedhack DLL (32-bit and 64-bit)
      # ------------------------------------------------------------------
      - name: Build speedhack 32-bit
        run: lazbuild "Cheat Engine\speedhack\speedhack.lpi" --build-mode="32-bit" --build-all

      - name: Build speedhack 64-bit
        run: lazbuild "Cheat Engine\speedhack\speedhack.lpi" --build-mode="64-bit" --build-all

      # ------------------------------------------------------------------
      # Build allochook DLL (32-bit and 64-bit)
      # ------------------------------------------------------------------
      - name: Build allochook 32-bit
        run: lazbuild "Cheat Engine\allochook\allochook.lpi" --build-mode="32" --build-all

      - name: Build allochook 64-bit
        run: lazbuild "Cheat Engine\allochook\allochook.lpi" --build-mode="64" --build-all

      # ------------------------------------------------------------------
      # Build VEHDebug (32-bit and 64-bit)
      # ------------------------------------------------------------------
      - name: Build VEHDebug 32-bit
        run: lazbuild "Cheat Engine\VEHDebug\vehdebug.lpi" --build-mode="release 32" --build-all

      - name: Build VEHDebug 64-bit
        run: lazbuild "Cheat Engine\VEHDebug\vehdebug.lpi" --build-mode="release 64" --build-all

      # ------------------------------------------------------------------
      # Build Tutorial (32-bit and 64-bit)
      # ------------------------------------------------------------------
      - name: Build Tutorial 32-bit
        run: lazbuild "Cheat Engine\Tutorial\tutorial.lpi" --build-mode="release 32-Bit" --build-all

      - name: Build Tutorial 64-bit
        run: lazbuild "Cheat Engine\Tutorial\tutorial.lpi" --build-mode="release 64-Bit" --build-all

      # ------------------------------------------------------------------
      # Build xmplayer and cecore
      # ------------------------------------------------------------------
      - name: Build xmplayer
        run: lazbuild "Cheat Engine\xmplayer\xmplayer.lpi" --build-all

      - name: Build cecore
        run: lazbuild "Cheat Engine\cecore.lpi" --build-all

      # ------------------------------------------------------------------
      # Upload Lazarus build output
      # ------------------------------------------------------------------
      - name: List build output
        shell: pwsh
        run: |
          if (Test-Path "Cheat Engine\bin") {
            Get-ChildItem -Recurse "Cheat Engine\bin" | Select-Object FullName
          } else {
            Write-Warning "No bin directory found"
          }

      - name: Upload Lazarus artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cheat-engine-lazarus-win
          path: "Cheat Engine/bin/"
          if-no-files-found: warn

  # =========================================================================
  # Job 2: Build MSVC C++ / C# components (DirectX hooks, data collectors)
  # =========================================================================
  build-msvc:
    name: Build MSVC Components (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      # ------------------------------------------------------------------
      # Install Microsoft.DXSDK.D3DX NuGet package to get the legacy
      # d3dx9.h / d3dx10.h / d3dx11.h headers that the DirectX hook
      # projects require (not shipped with the modern Windows SDK).
      # VS2022 MSBuild no longer includes $(INCLUDE) in IncludePath, so
      # we inject the paths via Directory.Build.props instead.
      # ------------------------------------------------------------------
      - name: Install DirectX SDK headers (Microsoft.DXSDK.D3DX NuGet)
        shell: pwsh
        run: |
          nuget install Microsoft.DXSDK.D3DX -Version 9.29.952.8 `
            -OutputDirectory "$env:TEMP\nuget" -NonInteractive -Source https://api.nuget.org/v3/index.json
          $pkg = (Get-ChildItem "$env:TEMP\nuget\Microsoft.DXSDK.D3DX.*" -Directory | Select-Object -First 1).FullName
          $inc  = "$pkg\build\native\include"
          $libX86 = "$pkg\build\native\lib\x86"
          $libX64 = "$pkg\build\native\lib\x64"
          Write-Host "DXSDK include : $inc"
          Write-Host "DXSDK lib x86 : $libX86"
          Write-Host "DXSDK lib x64 : $libX64"
          # Write Directory.Build.props so MSBuild picks up the headers/libs
          # for every project inside "Direct x mess\" (VS2022 no longer
          # exposes $(INCLUDE) through IncludePath).
          $props = @"
<?xml version="1.0" encoding="utf-8"?>
<Project>
  <ItemDefinitionGroup>
    <ClCompile>
      <AdditionalIncludeDirectories>$inc;%(AdditionalIncludeDirectories)</AdditionalIncludeDirectories>
    </ClCompile>
  </ItemDefinitionGroup>
  <ItemDefinitionGroup Condition="'`$(Platform)'=='Win32'">
    <Link>
      <AdditionalLibraryDirectories>$libX86;%(AdditionalLibraryDirectories)</AdditionalLibraryDirectories>
    </Link>
  </ItemDefinitionGroup>
  <ItemDefinitionGroup Condition="'`$(Platform)'=='x64'">
    <Link>
      <AdditionalLibraryDirectories>$libX64;%(AdditionalLibraryDirectories)</AdditionalLibraryDirectories>
    </Link>
  </ItemDefinitionGroup>
</Project>
"@
          $props | Set-Content "Cheat Engine\Direct x mess\Directory.Build.props" -Encoding UTF8
          Write-Host "Wrote Directory.Build.props"

      # ------------------------------------------------------------------
      # DirectX hooks — projects use v120 (VS 2013) toolset; retarget to
      # v143 (VS 2022) which is available on the runner.
      # ------------------------------------------------------------------
      - name: Build DirectX hooks Win32
        shell: pwsh
        run: |
          msbuild "Cheat Engine\Direct x mess\Direct x mess.sln" `
            /p:Configuration=Release /p:Platform=Win32 `
            /p:PlatformToolset=v143 /p:WindowsTargetPlatformVersion=10.0 `
            /m /nologo

      - name: Build DirectX hooks x64
        shell: pwsh
        run: |
          msbuild "Cheat Engine\Direct x mess\Direct x mess.sln" `
            /p:Configuration=Release /p:Platform=x64 `
            /p:PlatformToolset=v143 /p:WindowsTargetPlatformVersion=10.0 `
            /m /nologo

      # ------------------------------------------------------------------
      # MonoDataCollector — uses v141_xp (VS 2017 XP); retarget to v143.
      # ------------------------------------------------------------------
      - name: Build MonoDataCollector Win32
        shell: pwsh
        run: |
          msbuild "Cheat Engine\MonoDataCollector\MonoDataCollector.sln" `
            /p:Configuration=Release /p:Platform=Win32 `
            /p:PlatformToolset=v143 /p:WindowsTargetPlatformVersion=10.0 `
            /m /nologo

      - name: Build MonoDataCollector x64
        shell: pwsh
        run: |
          msbuild "Cheat Engine\MonoDataCollector\MonoDataCollector.sln" `
            /p:Configuration=Release /p:Platform=x64 `
            /p:PlatformToolset=v143 /p:WindowsTargetPlatformVersion=10.0 `
            /m /nologo

      # ------------------------------------------------------------------
      # DotNetDataCollector — already uses v141/v143; retarget to v143 for
      # any v141 configs.
      # ------------------------------------------------------------------
      - name: Build DotNetDataCollector Win32
        shell: pwsh
        run: |
          msbuild "Cheat Engine\DotNetDataCollector\DotNetDataCollector.sln" `
            /p:Configuration=Release /p:Platform=Win32 `
            /p:PlatformToolset=v143 /p:WindowsTargetPlatformVersion=10.0 `
            /m /nologo

      - name: Build DotNetDataCollector x64
        shell: pwsh
        run: |
          msbuild "Cheat Engine\DotNetDataCollector\DotNetDataCollector.sln" `
            /p:Configuration=Release /p:Platform=x64 `
            /p:PlatformToolset=v143 /p:WindowsTargetPlatformVersion=10.0 `
            /m /nologo

      # ------------------------------------------------------------------
      # DotNetInvasiveDataCollector (C# — Any CPU)
      # ------------------------------------------------------------------
      - name: Build DotNetInvasiveDataCollector
        shell: pwsh
        run: |
          msbuild "Cheat Engine\DotNetInvasiveDataCollector\DotNetInvasiveDataCollector.sln" `
            /p:Configuration=Release /p:Platform="Any CPU" /m /nologo
        continue-on-error: true

      # ------------------------------------------------------------------
      # CSCompiler (C# — Any CPU)
      # ------------------------------------------------------------------
      - name: Build CSCompiler
        shell: pwsh
        run: |
          msbuild "Cheat Engine\DotNetCompiler\CSCompiler\CSCompiler.sln" `
            /p:Configuration=Release /p:Platform="Any CPU" /m /nologo
        continue-on-error: true

      # ------------------------------------------------------------------
      # Collect and upload MSVC artifacts
      # ------------------------------------------------------------------
      - name: Upload MSVC artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cheat-engine-msvc-win
          path: |
            Cheat Engine/bin/autorun/dlls/
            Cheat Engine/Direct x mess/Release/
            Cheat Engine/Direct x mess/x64/Release/
          if-no-files-found: warn

  # =========================================================================
  # Job 3: Build kernel driver using WDK
  # =========================================================================
  build-driver:
    name: Build Kernel Driver (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------------------------
      # Download and install the WDK — required for the
      # WindowsKernelModeDriver10.0 platform toolset used by DBKKernel.
      # The WDK installer is ~1.5 GB; allow up to 15 minutes.
      # ------------------------------------------------------------------
      - name: Download WDK installer
        shell: pwsh
        run: |
          Write-Host "Downloading WDK for Windows 11 22H2 (~1.5 GB)..."
          curl.exe -L --retry 3 --retry-delay 10 -o wdksetup.exe `
            "https://go.microsoft.com/fwlink/?linkid=2196230"
          if ($LASTEXITCODE -ne 0) { Write-Error "WDK download failed"; exit 1 }
          Write-Host "Download complete."

      - name: Install WDK silently
        shell: pwsh
        run: |
          Write-Host "Installing WDK (this may take several minutes)..."
          $proc = Start-Process -FilePath ".\wdksetup.exe" `
            -ArgumentList "/quiet /norestart" -Wait -PassThru
          if ($proc.ExitCode -notin @(0, 3010)) {
            Write-Error "WDK installer exited with code $($proc.ExitCode)"
            exit $proc.ExitCode
          }
          Write-Host "WDK installed (exit code $($proc.ExitCode))."

      - name: Set WDKContentRoot environment variable
        shell: pwsh
        run: |
          $wdkRoot = "C:\Program Files (x86)\Windows Kits\10\"
          # Find the highest installed WDK version that has km headers
          $kmVer = Get-ChildItem "$wdkRoot\Include" -Directory -ErrorAction SilentlyContinue |
            Where-Object { Test-Path "$($_.FullName)\km\ntifs.h" } |
            Sort-Object Name -Descending | Select-Object -First 1
          if ($kmVer) {
            Write-Host "WDK km headers found: $($kmVer.FullName)\km"
            echo "WDKContentRoot=$wdkRoot"        >> $env:GITHUB_ENV
            echo "WindowsDriverKitDir=$wdkRoot"   >> $env:GITHUB_ENV
            echo "WDKVersion=$($kmVer.Name)"      >> $env:GITHUB_ENV
          } else {
            Write-Host "WDK km headers not yet visible; listing Include dirs:"
            Get-ChildItem "$wdkRoot\Include" -ErrorAction SilentlyContinue | Format-Table Name
            Write-Host "Falling back to hardcoded WDKContentRoot"
            echo "WDKContentRoot=$wdkRoot"        >> $env:GITHUB_ENV
            echo "WindowsDriverKitDir=$wdkRoot"   >> $env:GITHUB_ENV
          }

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      # Build both 32-bit and 64-bit kernel drivers
      - name: Build DBKKernel x64
        shell: pwsh
        run: |
          msbuild DBKKernel\DBKKernel.sln `
            /p:Configuration=Release /p:Platform=x64 /m /nologo `
            /p:WindowsDriverKitDir="$env:WindowsDriverKitDir" `
            /p:WDKContentRoot="$env:WDKContentRoot" `
            /p:WDKVersion="$env:WDKVersion"

      - name: Build DBKKernel Win32
        shell: pwsh
        run: |
          msbuild DBKKernel\DBKKernel.sln `
            /p:Configuration=Release /p:Platform=Win32 /m /nologo `
            /p:WindowsDriverKitDir="$env:WindowsDriverKitDir" `
            /p:WDKContentRoot="$env:WDKContentRoot" `
            /p:WDKVersion="$env:WDKVersion"

      # Collect .sys + .inf output files
      - name: Locate driver output files
        shell: pwsh
        run: |
          Get-ChildItem -Path DBKKernel -Recurse -Include "*.sys","*.inf","*.cat" |
            Select-Object FullName | Format-Table -AutoSize

      - name: Upload kernel driver artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cheat-engine-driver
          path: |
            DBKKernel/**/Release/*.sys
            DBKKernel/**/Release/*.inf
            DBKKernel/**/Release/*.cat
            DBKKernel/**/x64/Release/*.sys
            DBKKernel/**/x64/Release/*.inf
            DBKKernel/**/x64/Release/*.cat
          if-no-files-found: warn

  # =========================================================================
  # Job 4: Build ceserver on Linux (64-bit and 32-bit)
  # =========================================================================
  build-ceserver:
    name: Build ceserver (Linux)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Enable i386 architecture and install dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update -qq
          sudo apt-get install -y gcc gcc-multilib zlib1g-dev zlib1g-dev:i386

      - name: Build ceserver 64-bit
        run: |
          cd "Cheat Engine/ceserver/gcc"
          make

      - name: Rename 64-bit binary
        run: mv "Cheat Engine/ceserver/gcc/ceserver" "Cheat Engine/ceserver/gcc/ceserver64"

      - name: Build ceserver 32-bit
        run: |
          cd "Cheat Engine/ceserver/gcc"
          make -f makefile32 all

      - name: Rename 32-bit binary
        run: mv "Cheat Engine/ceserver/gcc/ceserver" "Cheat Engine/ceserver/gcc/ceserver32"

      - name: Upload ceserver artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ceserver-linux
          path: |
            Cheat Engine/ceserver/gcc/ceserver32
            Cheat Engine/ceserver/gcc/ceserver64
          if-no-files-found: error

  # =========================================================================
  # Job 5: Assemble final release package (runs only on pushes to master)
  # =========================================================================
  package:
    name: Package Release
    runs-on: windows-latest
    needs:
      - build-lazarus
      - build-msvc
      - build-driver
      - build-ceserver
    if: >-
      !cancelled() &&
      (needs.build-lazarus.result == 'success' || needs.build-msvc.result == 'success' ||
       needs.build-driver.result == 'success' || needs.build-ceserver.result == 'success') &&
      (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')

    steps:
      - name: Download Lazarus artifacts
        uses: actions/download-artifact@v4
        with:
          name: cheat-engine-lazarus-win
          path: release/bin
        continue-on-error: true

      - name: Download MSVC artifacts
        uses: actions/download-artifact@v4
        with:
          name: cheat-engine-msvc-win
          path: release/msvc
        continue-on-error: true

      - name: Download kernel driver artifacts
        uses: actions/download-artifact@v4
        with:
          name: cheat-engine-driver
          path: release/driver
        continue-on-error: true

      - name: Download ceserver artifacts
        uses: actions/download-artifact@v4
        with:
          name: ceserver-linux
          path: release/ceserver
        continue-on-error: true

      - name: List release contents
        shell: pwsh
        run: Get-ChildItem -Recurse release | Select-Object FullName

      - name: Create release archive
        shell: pwsh
        run: 7z a "CheatEngine-${{ github.sha }}.zip" .\release\*

      - name: Upload release archive
        uses: actions/upload-artifact@v4
        with:
          name: CheatEngine-Release
          path: CheatEngine-${{ github.sha }}.zip
          if-no-files-found: warn
